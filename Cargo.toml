[package]
name = "transcribe-studio"
version = "1.0.0"
edition = "2021"
description = "Transcribe Studio - audio transcription and Markdown conversion"
authors = ["Fyodor"]
license = "MIT"
repository = "https://github.com/teocreate/transcribe-studio"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
# Two copies would fight over the settings file and saturate the CPU with
# competing transcriptions.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "fs", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
rfd = "0.15"
dirs = "5"
chrono = "0.4"
anyhow = "1"
sha2 = "0.10"
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_Foundation", "Win32_System_Registry", "Win32_Globalization", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
